<section id="diagnostic" class="diagnostic-section">
  <div class="container">
    <app-section-title title="С чего начинается ваш запрос?" subtitle="Диагностика и саморефлексия"
      align="center"></app-section-title>

    <div class="diagnostic-intro reveal">
      <p>
        Что откликается вам сейчас? Выберите близкое вам состояние,
        чтобы узнать, с какого направления можно начать работу.
      </p>
    </div>

    <div class="diagnostic-grid reveal">
      <div *ngFor="let card of diagnosticCards; let idx = index" class="diagnostic-option">
      <button class="diagnostic-card" type="button"
        [class.selected]="selectedCardId() === card.id" [attr.aria-expanded]="selectedCardId() === card.id"
        [attr.aria-controls]="selectedCardId() === card.id ? 'diagnostic-recommendation' : null" (click)="selectCard(card.id)">
        <span class="card-topline">
          <span class="card-number">0{{ idx + 1 }}</span>
          <span class="card-rule"></span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="9" />
            <path *ngIf="selectedCardId() === card.id" d="m8 12 3 3 5-6" />
          </svg>
        </span>
        <span class="question-text">{{ card.question }}</span>
        <span class="card-action">
          <span>{{ selectedCardId() === card.id ? 'Рекомендация ниже' : 'Посмотреть рекомендацию' }}</span>
          <svg class="disclosure-arrow" [class.expanded]="selectedCardId() === card.id" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="m6 9 6 6 6-6" />
          </svg>
        </span>
      </button>
    <!-- Active Guidance Recommendation Block -->
    <div id="diagnostic-recommendation" class="recommendation-panel" *ngIf="selectedCardId() === card.id" role="region" aria-labelledby="recommendation-title" aria-live="polite">
      <div class="recommendation-content fade-in">
        <div class="recommendation-header">
          <span class="recommendation-badge">Вектор работы</span>
          <h3 id="recommendation-title" class="recommendation-title">С чего можно начать</h3>
        </div>

        <p class="feedback-text">{{ card.feedback }}</p>

        <div class="direction-box">
          <span class="direction-label">Рекомендуемое направление:</span>
          <p class="direction-text">{{ card.recommendation }}</p>
        </div>

        <div class="recommendation-action">
          <app-button variant="primary" (click)="scrollToSection('contact')">
            Обсудить запрос на сессии
          </app-button>
        </div>
      </div>
    </div>
      </div>
    </div>
  </div>
</section>
